name: desktop

on:
  schedule:
    # 每天 03:00 UTC 探测上游新提交。
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream revision (default: origin/master)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test builder
        shell: pwsh
        run: node --test tests/*.test.mjs

      # Hosted builds are explicitly unsigned and manually distributed without a policy service.
      - name: Detect upstream revision
        id: detect
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if (-not (Test-Path harness/.git)) {
            git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness.git harness
          }
          git -C harness fetch origin --tags --prune
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed' }
          $ref = $env:REQUESTED_REF
          if (-not $ref) { $ref = 'origin/master' }
          git -C harness checkout --quiet --detach $ref
          if ($LASTEXITCODE -ne 0) { throw 'Upstream checkout failed' }
          $version = (Get-Content harness/package.json -Raw | ConvertFrom-Json).version
          $fullCommit = git -C harness rev-parse HEAD
          $commit = $fullCommit.Substring(0, 10)
          "ref=$fullCommit" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          gh release view "dsh-desktop-$version-$commit" *> $null
          "exists=$($LASTEXITCODE -eq 0)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        if: steps.detect.outputs.exists != 'true'
        shell: pwsh
        env:
          DSH_DESKTOP_APP_ID: ${{ vars.DSH_DESKTOP_APP_ID }}
          DSH_DESKTOP_PRODUCT_NAME: ${{ vars.DSH_DESKTOP_PRODUCT_NAME }}
          UPSTREAM_COMMIT: ${{ steps.detect.outputs.ref }}
        run: ./build.ps1 -Ref $env:UPSTREAM_COMMIT -Mode unsigned -DisableMandatoryUpdate

      - name: Publish release
        if: steps.detect.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $info = Get-Content dist/last-build.json -Raw | ConvertFrom-Json
          # The tag is the coordination point with a release published by hand: both use
          # dsh-desktop-<version>-<commit>, so a build someone already shipped is never rebuilt here.
          $tag = "dsh-desktop-$($info.upstreamVersion)-$($info.upstreamCommit.Substring(0, 10))"
          $notes = @(
            "Upstream dsh $($info.upstreamVersion) ($($info.upstreamCommit))"
            "Revision: $($info.upstreamRef)"
            "Mode: $($info.releaseMode)"
            "App id: $($info.appId)"
          ) -join "`n"
          $assets = @(Get-ChildItem -LiteralPath $info.outputRoot -File | Select-Object -ExpandProperty FullName)
          gh release create $tag `
            --title "$($info.productName) $($info.upstreamVersion) ($($info.upstreamCommit))" `
            --notes $notes `
            @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Already released
        if: steps.detect.outputs.exists == 'true'
        run: Write-Host "dsh-desktop-${{ steps.detect.outputs.version }}-${{ steps.detect.outputs.commit }} already published; nothing to do."

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.exists != 'true'
        with:
          name: dsh-desktop-win-x64
          path: |
            dist/*-unsigned/*.exe
            dist/*-unsigned/*.blockmap
            dist/*-unsigned/build-info.json
          retention-days: 14
